# Stage70 Day03: disposable isolated lab; require independent image digests
name: cybersec-day03
services:
  day03-target:
    container_name: cybersec-day03-target
    image: ${CYBERSEC_DAY03_TARGET_IMAGE:?Provide independently approved digest-pinned target image}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    volumes:
      - ./fixture:/usr/share/nginx/html:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=8m
      - /var/cache/nginx:noexec,nosuid,size=8m
      - /var/run:noexec,nosuid,size=8m
    networks:
      lab:
        aliases: [day03-target]
    restart: "no"
  zap:
    container_name: cybersec-day03-zap
    image: ${CYBERSEC_DAY03_ZAP_IMAGE:?Provide independently approved digest-pinned ZAP image}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:18080:8080"
    networks: [lab]
    tmpfs:
      - /tmp:nosuid,size=512m
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=false
      - -config
      - api.key=${CYBERSEC_DAY03_ZAP_API_KEY:?Set a temporary 24+ character API key}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    restart: "no"
    stop_grace_period: 15s
networks:
  lab:
    internal: true
