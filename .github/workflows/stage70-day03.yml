name: Stage70 Day03 WP07-WP09 bounded ZAP lab integration strict
on:
  push:
    branches:
      - feature/stage70-day03-wp07-wp09-20261124
  pull_request:
    paths:
      - src/cybersec/day02.py
      - src/cybersec/db.py
      - tools/day02_e2e.py
      - tools/day02_package.py
      - tests/test_stage70_day02.py
      - tests/test_stage70_day03_zap.py
      - src/cybersec/day03_zap.py
      - deployment/day03/**
      - Stage70_DAY03_ZAP.command
      - tools/day03_mock_e2e.py
      - tools/day03_package.py
      - .github/workflows/stage70-day03.yml
      - Stage70_DAY02_DEMO.command
      - .github/workflows/stage70-day02.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-e2e:
    runs-on: ubuntu-latest
    name: independent-day03-run-${{ matrix.round }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        round: [1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install product and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Three strict suites, independent per runner
        shell: bash
        run: |
          mkdir -p .day03_ci
          set +e
          python -W error::ResourceWarning -W error::DeprecationWarning -m pytest -q tests >.day03_ci/pytest.stdout 2>.day03_ci/pytest.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >.day03_ci/pytest.exitcode
          tail -25 .day03_ci/pytest.stdout || true
          test "$rc" -eq 0
      - name: Local Day01 and Day02 product E2E
        shell: bash
        run: |
          set +e
          bash Stage70_DAY01_DEMO.command --review >.day03_ci/day01_review.stdout 2>.day03_ci/day01_review.stderr
          r0=$?
          bash Stage70_DAY01_DEMO.command --check >.day03_ci/day01_check.stdout 2>.day03_ci/day01_check.stderr
          r1=$?
          bash Stage70_DAY01_DEMO.command --run >.day03_ci/day01_run.stdout 2>.day03_ci/day01_run.stderr
          r2=$?
          bash Stage70_DAY02_DEMO.command --review >.day03_ci/day02_review.stdout 2>.day03_ci/day02_review.stderr
          r3=$?
          bash Stage70_DAY02_DEMO.command --check >.day03_ci/day02_check.stdout 2>.day03_ci/day02_check.stderr
          r4=$?
          bash Stage70_DAY02_DEMO.command --run >.day03_ci/day02_run.stdout 2>.day03_ci/day02_run.stderr
          r5=$?
          CYBERSEC_EXECUTION_MODE=production bash Stage70_DAY02_DEMO.command --check >.day03_ci/production_deny.stdout 2>.day03_ci/production_deny.stderr
          r6=$?
          set -e
          for spec in "day01_review:$r0" "day01_check:$r1" "day01_run:$r2" "day02_review:$r3" "day02_check:$r4" "day02_run:$r5" "production_deny:$r6"; do
            name="$(printf '%s' "$spec" | cut -d: -f1)"
            code="$(printf '%s' "$spec" | cut -d: -f2)"
            echo "$code" >".day03_ci/$name.exitcode"
          done
          test "$r0" -eq 0 && test "$r1" -eq 0 && test "$r2" -eq 0
          test "$r3" -eq 0 && test "$r4" -eq 0 && test "$r5" -eq 0 && test "$r6" -eq 4
      - name: Reproducible FULL and one LIGHT ZIP, checked after extraction
        shell: bash
        run: |
          set +e
          python tools/day03_package.py --out-dir dist >.day03_ci/package.stdout 2>.day03_ci/package.stderr
          rc=$?
          set -e
          echo "$rc" >.day03_ci/package.exitcode
          cat .day03_ci/package.stdout || true
          cat .day03_ci/package.stderr || true
          test "$rc" -eq 0
      - name: Bounded ZAP Day03 lab mock and live Docker refusal
        shell: bash
        run: |
          mkdir -p .day03_ci
          set +e
          python -W error::ResourceWarning -W error::DeprecationWarning -m cybersec.day03_zap --review >.day03_ci/day03_review.stdout 2>.day03_ci/day03_review.stderr
          r0=$?
          python -W error::ResourceWarning -W error::DeprecationWarning -m cybersec.day03_zap --check >.day03_ci/day03_check.stdout 2>.day03_ci/day03_check.stderr
          r1=$?
          python -W error::ResourceWarning -W error::DeprecationWarning tools/day03_mock_e2e.py --out .day03_evidence/mock >.day03_ci/day03_mock.stdout 2>.day03_ci/day03_mock.stderr
          r2=$?
          CYBERSEC_EXECUTION_MODE=production python -m cybersec.day03_zap --review >.day03_ci/day03_production_deny.stdout 2>.day03_ci/day03_production_deny.stderr
          r3=$?
          set -e
          for spec in "day03_review:$r0" "day03_check:$r1" "day03_mock:$r2" "day03_production_deny:$r3"; do
            name="$(printf '%s' "$spec" | cut -d: -f1)"
            rc="$(printf '%s' "$spec" | cut -d: -f2)"
            echo "$rc" >".day03_ci/$name.exitcode"
          done
          printf 'REAL_ZAP_AND_AJAX=SKIP_NOT_PROVISIONED_ON_CI\n' > .day03_ci/real_zap.status
          test "$r0" -eq 0 && test "$r1" -eq 4 && test "$r2" -eq 0 && test "$r3" -eq 4
      - name: Hash all retained evidence even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p .day03_ci
          python - <<'PY'
          from pathlib import Path
          import hashlib
          dirs=[Path('.day03_ci'),Path('.day01_evidence'),Path('.day02_evidence'),Path('.day03_evidence'),Path('dist')]
          files=sorted(p for d in dirs if d.exists() for p in d.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          Path('.day03_ci/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in files))
          print('SHA256_COUNT',len(files))
          PY
      - name: Store full stdout stderr exits, demo reports and ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage70-day03-evidence-run-${{ matrix.round }}
          path: |
            .day03_ci
            .day01_evidence
            .day02_evidence
            .day03_evidence
            dist
          include-hidden-files: true
          retention-days: 30
